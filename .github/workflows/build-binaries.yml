name: Build binaries

# Builds vault-tui for linux and darwin on amd64 and arm64 and attaches the
# archives, checksums and build-provenance attestations to the GitHub release
# of a version tag.
#
# Triggers:
#   - a v*.*.* tag is pushed (manual tags, or tags pushed with a PAT)
#   - called by release.yml right after semantic-release tags a version
#     (tags pushed with the default GITHUB_TOKEN do not trigger workflows)
#   - run by hand for an existing tag, e.g. to rebuild a release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v1.2.3
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Tag to build, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  binaries:
    name: Build and publish binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create/update the release and upload assets
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
