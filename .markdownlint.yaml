# Markdown lint rules (markdownlint)
default: true

# Tables and URLs make long lines unavoidable.
MD013: false
# CHANGELOG.md is generated by semantic-release and repeats headings.
MD024:
  siblings_only: true
# doctoc renders the TOC title as bold text (--title="**Table of Contents**").
MD036: false
# Allow a few inline HTML elements commonly used in READMEs.
MD033:
  allowed_elements: [details, summary, br, kbd]
