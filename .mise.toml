[tools]
go = "1.26.9"
golangci-lint = "2.12.2"
actionlint = "1.7.12"
shellcheck = "0.11.0"
pre-commit = "4.7.0"
gitleaks = "8.30.1"

[env]
# Never let a go.mod/go.sum change slip in implicitly.
GOFLAGS = "-mod=readonly"

[tasks.build]
description = "Build a static, reproducible vault-tui binary (no local paths embedded)"
env = { CGO_ENABLED = "0" }
run = "go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o bin/vault-tui ."

[tasks.test]
description = "Run unit tests (race detector, shuffled)"
run = "go test -race -shuffle=on -count=1 ./..."

[tasks.test-integration]
description = "Run integration tests against a dev Vault (needs VAULT_ADDR and VAULT_TOKEN)"
run = "go test -tags integration -count=1 ./internal/vault"

[tasks.test-coverage]
description = "Run tests and open HTML coverage report"
run = [
    "go test -race -coverprofile=coverage.out ./...",
    "go tool cover -html=coverage.out",
]

[tasks.fuzz]
description = "Fuzz the terminal-output sanitiser"
run = "go test ./internal/tui/safe -run '^$' -fuzz FuzzLineNeverEmitsControls -fuzztime 20s"

[tasks.lint]
description = "Run golangci-lint (includes gosec)"
run = "golangci-lint run ./..."

[tasks.lint-workflows]
description = "Lint GitHub Actions workflows (actionlint) and shell scripts (shellcheck)"
run = [
    "actionlint",
    "shellcheck scripts/*.sh",
]

[tasks.verify]
description = "Verify module integrity and that go.mod/go.sum are tidy"
run = [
    "go mod verify",
    "go mod tidy -diff",
]

[tasks.vuln]
description = "Scan dependencies and stdlib for known vulnerabilities"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.hygiene]
description = "Fail if the repo contains machine-specific paths, real-looking emails or token-like strings"
run = '''
# Addresses on the reserved example.{com,org,net} domains are generic and allowed.
found=$(git grep -nIE --untracked \
  -e '(/home/[A-Za-z0-9_.-]+|/Users/[A-Za-z0-9_.-]+|C:\\Users\\)' \
  -e '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' \
  -e '\b(hvs|hvb|hvr)\.[A-Za-z0-9_-]{20,}' \
  -- . ':!.mise.toml' ':!go.sum' | grep -vE '@[A-Za-z0-9.-]*example\.(com|org|net)' || true)
if [ -n "$found" ]; then
  echo "$found" >&2
  echo "hygiene: machine-specific or secret-looking data found (see above)" >&2
  exit 1
fi
'''

[tasks.secrets]
description = "Scan the whole git history for committed secrets (gitleaks)"
run = "gitleaks git --redact --verbose"

[tasks.hooks]
description = "Install the git hooks (pre-commit, commit-msg, pre-push)"
run = "pre-commit install --install-hooks"

[tasks.pre-commit]
description = "Run every pre-commit hook on all files"
run = "pre-commit run --all-files"

[tasks.security]
description = "All security gates: hygiene, module integrity, lint/gosec, vulnerabilities"
depends = ["hygiene", "verify", "lint", "lint-workflows", "vuln", "secrets"]

[tasks.check]
description = "Everything: security gates plus the unit tests"
depends = ["security", "test"]

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/ coverage.out"

[tasks.tidy]
description = "Tidy go modules"
run = "go mod tidy"
